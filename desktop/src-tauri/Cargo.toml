[package]
name = "wechat-chat-summary-desktop"
version = "0.2.3"
description = "Windows desktop client for local WeChat group summaries"
authors = ["bluntvoice"]
edition = "2021"

[lib]
name = "wechat_chat_summary_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
