[package]
name = "wechat-chat-summary-desktop"
version = "0.2.1"
description = "Windows desktop client for local WeChat group summaries"
authors = ["bluntvoice"]
edition = "2021"

[lib]
name = "wechat_chat_summary_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
