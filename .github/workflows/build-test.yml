name: Build Windows test installer

on:
  workflow_dispatch:
    inputs:
      target_version:
        description: "测试安装包目标基础版本（不带 v，例如 1.2.0）"
        required: true
        default: "1.2.0"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64 test installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            desktop/requirements-build.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress

      - name: Install build dependencies
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          python -m pip install -r requirements.txt -r desktop/requirements-build.txt
          npm ci --prefix desktop

      - name: Set ephemeral test package version
        working-directory: desktop
        shell: pwsh
        env:
          TARGET_VERSION: ${{ inputs.target_version }}
        run: |
          if ($env:TARGET_VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw "测试安装包目标版本必须使用 x.y.z。"
          }
          node scripts/version.mjs --assert-not-lower $env:TARGET_VERSION
          node scripts/version.mjs --set $env:TARGET_VERSION
          npm run version:check

      - name: Run updater tests
        shell: pwsh
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --lib --locked

      - name: Build installer and checksum
        id: package
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}\desktop\src-tauri\target
        run: |
          ./desktop/scripts/build-windows-test-package.ps1 `
            -PackageKind Test `
            -OutputDirectory "$env:RUNNER_TEMP\wechat-chat-summary-artifacts" `
            -SkipDependencyInstall

      - name: Upload test installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: wechat-chat-summary-v${{ steps.package.outputs.version }}-windows-test
          path: |
            ${{ steps.package.outputs.installer }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          retention-days: 14
