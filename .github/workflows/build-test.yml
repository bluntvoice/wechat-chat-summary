name: Build Windows test installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64 test installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            desktop/requirements-build.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress

      - name: Install build dependencies
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          python -m pip install -r requirements.txt -r desktop/requirements-build.txt
          npm ci --prefix desktop

      - name: Check version consistency
        working-directory: desktop
        shell: pwsh
        run: npm run version:check

      - name: Run updater tests
        shell: pwsh
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --lib --locked

      - name: Build installer and checksum
        id: package
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}\desktop\src-tauri\target
        run: |
          ./desktop/scripts/build-windows-test-package.ps1 `
            -PackageKind Test `
            -OutputDirectory "$env:RUNNER_TEMP\wechat-chat-summary-artifacts" `
            -SkipDependencyInstall

      - name: Upload test installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: wechat-chat-summary-v${{ steps.package.outputs.version }}-windows-test
          path: |
            ${{ steps.package.outputs.installer }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          retention-days: 14
