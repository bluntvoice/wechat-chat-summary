name: Release Windows installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: "目标版本号（不带 v，例如 0.3.0 或 0.3.0-beta.1）"
        required: true
        type: string
      channel:
        description: "发布通道"
        required: true
        type: choice
        options:
          - prerelease
          - stable
      release_notes:
        description: "版本亮点正文（必填，工作流会自动添加 Markdown 标题）"
        required: true
        type: string
      confirm_real_release:
        description: "确认这是面向真实用户的正式发布，并已完成开源许可与发布内容复核"
        required: true
        default: false
        type: boolean
      allow_release_within_24h:
        description: "若距上一版本不足 24 小时，确认仍要继续发布"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Test, build and publish Windows x64
    runs-on: windows-latest
    timeout-minutes: 75

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            desktop/requirements-build.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress

      - name: Validate release request
        id: release_request
        shell: pwsh
        env:
          TARGET_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          CONFIRM_REAL_RELEASE: ${{ inputs.confirm_real_release }}
          ALLOW_WITHIN_24H: ${{ inputs.allow_release_within_24h }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ($env:CONFIRM_REAL_RELEASE -ne "true") {
            throw "未勾选真实发布确认。测试安装包请改用 Build Windows test installer。"
          }
          if ($env:GITHUB_REF_NAME -ne $env:DEFAULT_BRANCH) {
            throw "Release 只能从默认分支 $env:DEFAULT_BRANCH 运行，当前为 $env:GITHUB_REF_NAME。"
          }
          if ($env:RELEASE_CHANNEL -eq "stable" -and $env:TARGET_VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw "stable 版本必须使用 x.y.z，例如 0.3.0。"
          }
          if ($env:RELEASE_CHANNEL -eq "prerelease" -and $env:TARGET_VERSION -notmatch '^\d+\.\d+\.\d+-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*$') {
            throw "prerelease 版本必须包含预发布后缀，例如 0.3.0-beta.1。"
          }

          node desktop/scripts/version.mjs --check
          if ($LASTEXITCODE -ne 0) { throw "当前版本文件不一致。" }
          node desktop/scripts/version.mjs --assert-greater $env:TARGET_VERSION
          if ($LASTEXITCODE -ne 0) { throw "目标版本必须高于当前版本。" }

          $tag = "v$env:TARGET_VERSION"
          git fetch --tags --force
          if (git tag --list $tag) { throw "Tag $tag 已存在，拒绝覆盖。" }
          $remoteTag = git ls-remote --tags origin "refs/tags/$tag"
          if ($remoteTag) { throw "远端 Tag $tag 已存在，拒绝覆盖。" }

          $latestTagLine = git for-each-ref --sort=-creatordate --format='%(refname:short)|%(creatordate:unix)' refs/tags | Select-Object -First 1
          if ($latestTagLine) {
            $parts = $latestTagLine -split '\|', 2
            $latestDate = [DateTimeOffset]::FromUnixTimeSeconds([int64]$parts[1])
            $hours = ([DateTimeOffset]::UtcNow - $latestDate).TotalHours
            if ($hours -lt 24 -and $env:ALLOW_WITHIN_24H -ne "true") {
              throw ("距上一 Tag {0} 仅 {1:N1} 小时。若确认必要，请勾选 24 小时内发布确认。" -f $parts[0], $hours)
            }
          }

          $notesBody = $env:RELEASE_NOTES.Trim()
          if ([string]::IsNullOrWhiteSpace($notesBody)) { throw "版本亮点不能为空。" }
          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          $notesDocument = "## 版本亮点`r`n`r`n$notesBody"
          [IO.File]::WriteAllText($notesPath, $notesDocument, [Text.UTF8Encoding]::new($false))

          $packageKind = if ($env:RELEASE_CHANNEL -eq "stable") { "Stable" } else { "Prerelease" }
          "version=$env:TARGET_VERSION" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "package_kind=$packageKind" >> $env:GITHUB_OUTPUT
          "notes_path=$notesPath" >> $env:GITHUB_OUTPUT
          "base_sha=$env:GITHUB_SHA" >> $env:GITHUB_OUTPUT

      - name: Set release version and update CHANGELOG
        shell: pwsh
        env:
          TARGET_VERSION: ${{ steps.release_request.outputs.version }}
          NOTES_PATH: ${{ steps.release_request.outputs.notes_path }}
        run: |
          node desktop/scripts/version.mjs --set $env:TARGET_VERSION
          ./desktop/scripts/prepare-release-notes.ps1 -Version $env:TARGET_VERSION -NotesPath $env:NOTES_PATH
          node desktop/scripts/version.mjs --check

      - name: Install build dependencies
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          python -m pip install -r requirements.txt -r desktop/requirements-build.txt
          npm ci --prefix desktop

      - name: Run Python tests and compile check
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q group_insight tests

      - name: Build frontend and check Rust
        shell: pwsh
        run: |
          npm run build --prefix desktop
          cargo check --manifest-path desktop/src-tauri/Cargo.toml --locked
          git diff --check

      - name: Build release installer and checksum
        id: package
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}\desktop\src-tauri\target
          PACKAGE_KIND: ${{ steps.release_request.outputs.package_kind }}
        run: |
          ./desktop/scripts/build-windows-test-package.ps1 `
            -PackageKind $env:PACKAGE_KIND `
            -OutputDirectory "$env:RUNNER_TEMP\wechat-chat-summary-release" `
            -SkipDependencyInstall

      - name: Validate changed release files
        shell: pwsh
        run: |
          $allowed = @(
            "CHANGELOG.md",
            "desktop/package.json",
            "desktop/package-lock.json",
            "desktop/src-tauri/tauri.conf.json",
            "desktop/src-tauri/Cargo.toml",
            "desktop/src-tauri/Cargo.lock"
          )
          $changed = @(git diff --name-only)
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -gt 0) {
            throw "Release 产生了未授权文件变更：$($unexpected -join ', ')"
          }
          foreach ($required in $allowed) {
            if ($required -notin $changed) { throw "Release 缺少预期版本变更：$required" }
          }

      - name: Commit version, create tag and push atomically
        shell: pwsh
        env:
          TARGET_VERSION: ${{ steps.release_request.outputs.version }}
          RELEASE_TAG: ${{ steps.release_request.outputs.tag }}
          BASE_SHA: ${{ steps.release_request.outputs.base_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin $env:DEFAULT_BRANCH
          $remoteSha = (git rev-parse "origin/$env:DEFAULT_BRANCH").Trim()
          if ($remoteSha -ne $env:BASE_SHA) {
            throw "默认分支在构建期间已更新。请从最新代码重新运行 Release。"
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git add desktop/package.json desktop/package-lock.json
          git add desktop/src-tauri/tauri.conf.json desktop/src-tauri/Cargo.toml desktop/src-tauri/Cargo.lock
          git commit -m "chore(release): v$env:TARGET_VERSION" -m "同步桌面端版本并更新发布日志；安装包已通过自动测试与 Windows 构建。"
          git tag -a $env:RELEASE_TAG -m "Release $env:RELEASE_TAG"
          git push --atomic origin "HEAD:refs/heads/$env:DEFAULT_BRANCH" "refs/tags/$env:RELEASE_TAG"

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_request.outputs.tag }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          NOTES_PATH: ${{ steps.release_request.outputs.notes_path }}
          INSTALLER: ${{ steps.package.outputs.installer }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
        run: |
          $arguments = @(
            "release", "create", $env:RELEASE_TAG,
            $env:INSTALLER, $env:CHECKSUM,
            "--verify-tag",
            "--title", "微信群聊总结 $env:RELEASE_TAG",
            "--notes-file", $env:NOTES_PATH
          )
          if ($env:RELEASE_CHANNEL -eq "prerelease") {
            $arguments += "--prerelease"
          }
          else {
            $arguments += "--latest"
          }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "创建 GitHub Release 失败。" }
